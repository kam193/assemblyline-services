name: PCAP-Extractor
version: $SERVICE_TAG
description: |
  This service list TCP flows and DNS queries from a pcap
  file using Tshark. If supported by Tshark, it can also extract files.
enabled: true

accepts: network/tcpdump
rejects: empty
stage: CORE
category: Static Analysis
file_required: true
timeout: 300
is_external: false
privileged: true

config:
  local_networks: "172.17.0.0/16"
  ignore_ips: "192.168.0.1"
  command_timeout: 30
  exfiltration_threshold_mb: 10
  # Domains longer than this (chars) fire the 'Long dynamic domain' heuristic; 0 disables
  long_domain_threshold: 50
  # A TXT record longer than this (chars) and not matching a known benign pattern is suspicious; 0 disables
  txt_max_length: 150
  # More different TXT queries than this in one PCAP is suspicious; 0 disables
  txt_queries_threshold: 5
  # Count no-score traffic towards the exfiltration metric (safelisted is never counted)
  exfiltration_count_no_score: false
  # Following will still be extracted if not safelisted, but without attaching any heuristics
  no_score_domains: ""
  no_score_ips: ""

submission_params:
  - default: 0
    name: max_packets_analyzed
    type: int
    value: 0
  - default: true
    name: extract_files
    type: bool
    value: true
  - default: true
    name: extract_streams
    type: bool
    value: true
  - default: true
    name: score_external_http
    type: bool
    value: true
  - default: true
    name: score_non_http_port
    type: bool
    value: true

# -1000: safe
# 0 - 299: informative
# 300 - 699: suspicious
# 700 - 999: highly suspicious
# >= 1000: malicious

heuristics:
  - description: Connection to external IP was found in the PCAP
    filetype: "*"
    heur_id: 1
    name: External HTTP connection
    score: 300
  - description: Connection to non-HTTP port was found in the PCAP. Very suspicious.
    filetype: "*"
    heur_id: 2
    name: Connection to non-HTTP port
    score: 700
  - description: Connection is sending out a lot of data. Possible exfiltrating data.
    filetype: "*"
    heur_id: 3
    name: Possible data exfiltration
    score: 700
  - description: Domain name is longer than the configured threshold. Possible DNS tunneling or exfiltration.
    filetype: "*"
    heur_id: 4
    name: Long dynamic domain
    score: 300
  - description: Unusually long non-standard TXT record, or many different TXT queries. Possible DNS tunneling or C2.
    filetype: "*"
    heur_id: 5
    name: Suspicious TXT records
    score: 500

docker_config:
  image: ${REGISTRY}ghcr.io/kam193/assemblyline-service-pcap-extractor:$SERVICE_TAG
  cpu_cores: 1.0
  ram_mb: 1500
  allow_internet_access: false

update_config:
  update_interval_seconds: 86400 # 24 hours
  generates_signatures: true
  wait_for_update: false # no default source shipped; service must start without rules
  signature_delimiter: custom
  custom_delimiter: "\n---\n"
  sources: []
  # Example source, a YAML file (or multi-doc YAML with "---" between rules) of:
  #   name: <unique rule name>
  #   action: safelist | no_score
  #   domains: [<regex>, ...]   # matched with fullmatch against network.dynamic.domain (incl. TLS SNI)
  #   uris: [<regex>, ...]      # matched with fullmatch against network.dynamic.uri
  # - uri: https://example.com/pcap-extractor-rules.yml
  #   name: sample_rules

dependencies:
  updates:
    container:
      ram_mb: 512
      ram_mb_min: 256
      allow_internet_access: true
      command: ["python", "-m", "service.updater"]
      image: ${REGISTRY}ghcr.io/kam193/assemblyline-service-pcap-extractor:$SERVICE_TAG
      ports: ["5003"]
    run_as_core: true

[tox]
envlist = py311,py310,py312,py314
work_dir = {env:WORK_DIR:.}/.tox
package_root = {env:WORK_DIR:.}
skip_missing_interpreters = true

; [flake8]
; max-line-length = 88
; extend-ignore = E203, W503
; exclude = .git,__pycache__,.venv,.tox
; max-complexity = 10

; [testenv]
; deps = -r requirements/requirements-test.txt
; commands =
;     pytest {posargs}

[testenv]
skip_install = true
change_dir = {env:WORK_DIR:.}
allowlist_externals = sh
commands_pre =
    sh -c 'if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; else pip install -r requirements.txt pytest assemblyline-service-utilities; fi'
commands =
    pytest {posargs}

[testenv:lint]
skip_install = true
deps =
    ruff
    ssort
commands_pre =
commands =
    ssort --check {env:WORK_DIR:.}
    ruff check {env:WORK_DIR:.}

[testenv:format]
skip_install = true
deps =
    ruff
    ssort
commands_pre =
commands =
    -ssort {env:WORK_DIR:.}
    -ruff check --fix {env:WORK_DIR:.}
    -ruff format {env:WORK_DIR:.}